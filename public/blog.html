<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentCar Manager | Tips de Viaje</title>
  <script src="./assets/js/theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/navbar-user.js" defer></script>
  <style>
    .blog-card { transition: transform 0.2s ease, box-shadow 0.2s ease; background-color: #ffffff; }
    .blog-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.10) !important; }
    .blog-icon-wrap { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 14px; font-size: 1.5rem; }
    [data-bs-theme="dark"] .blog-card { background-color: #1e2130 !important; border-color: rgba(255,255,255,0.08) !important; }
  </style>
</head>
<body class="dashboard-page">
  <div id="navbarContainer"></div>

  <main class="py-5 mb-4">
    <div class="container" style="max-width: 1140px;">
      
      <!-- Sección: Tips para Rentar -->
      <div class="mb-5">
        <h2 class="fw-bold mb-1"><i class="bi bi-key text-primary me-2"></i>Tips para Rentar</h2>
        <p class="text-secondary mb-4">Todo lo que necesitas saber antes de firmar un contrato de renta.</p>
        <div id="tipsRentaGrid" class="row g-4">
          <div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>
        </div>
      </div>

      <hr class="my-5 border-secondary opacity-25">

      <!-- Sección: Tips de Viaje -->
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-geo-alt text-success me-2"></i>Tips de Viaje</h2>
        <p class="text-secondary mb-4">Recomendaciones para una ruta segura y disfrutable.</p>
        <div id="tipsViajeGrid" class="row g-4">
          <div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./assets/js/blog.js"></script>
</body>
</html>
