<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentCar Manager | Categorías</title>

  <!-- TEMA: debe ir ANTES que Bootstrap para evitar flash -->
  <script src="../assets/js/theme-init.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script src="../assets/js/navbar.js" defer></script>
  <style>
    .category-card {
      border: 1px solid var(--border-color) !important;
      border-radius: var(--radius-lg) !important;
      background: #fff;
      transition: transform .2s ease, box-shadow .2s ease;
      overflow: hidden;
    }
    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,.10) !important;
    }
    .category-card.inactive {
      opacity: .6;
      filter: grayscale(.4);
    }
    .category-icon-wrap {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      margin: 1rem 1rem .75rem;
    }
    .category-icon-wrap i { font-size: 2.8rem; }
    .icon-blue   { background: rgba(37,99,235,.08);  color: #2563eb; }
    .icon-green  { background: rgba(16,185,129,.08); color: #10b981; }
    .icon-amber  { background: rgba(245,158,11,.08); color: #f59e0b; }
    .icon-purple { background: rgba(139,92,246,.08); color: #8b5cf6; }
    .icon-pink   { background: rgba(236,72,153,.08); color: #ec4899; }
    .icon-teal   { background: rgba(20,184,166,.08); color: #14b8a6; }
    .icon-red    { background: rgba(239,68,68,.08);  color: #ef4444; }
    .icon-indigo { background: rgba(99,102,241,.08); color: #6366f1; }
    .card-actions {
      border-top: 1px solid var(--border-color);
      padding: .75rem 1rem;
      display: flex;
      gap: .5rem;
    }
  </style>
</head>
<body class="dashboard-page">

  <div id="navbarContainer"></div>

  <main class="py-5">
    <div class="container">

      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
          <h2 class="fw-bold mb-1">
            <i class="bi bi-tags-fill text-primary me-2"></i>Categorías de vehículos
          </h2>
          <p class="text-secondary mb-0">Organiza los vehículos por tipo (SUV, sedán, pickup, etc.)</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCategoryModal">
          <i class="bi bi-plus-lg me-1"></i> Nueva categoría
        </button>
      </div>

      <div class="card info-card mb-4">
        <div class="card-body p-3">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-secondary"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="searchInput" placeholder="Buscar categoría...">
          </div>
        </div>
      </div>

      <div id="categoriesAlert" class="alert alert-danger d-none" role="alert"></div>

      <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        <p class="text-secondary mt-3">Cargando categorías...</p>
      </div>

      <div id="emptyState" class="d-none">
        <div class="text-center py-5">
          <i class="bi bi-tags fs-1 text-muted"></i>
          <p class="text-muted mt-3">No hay categorías registradas</p>
          <button class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#createCategoryModal">
            <i class="bi bi-plus-lg me-1"></i> Crear primera categoría
          </button>
        </div>
      </div>

      <div id="categoriesGrid" class="row g-4 d-none"></div>

    </div>
  </main>

  <!-- MODAL CREAR -->
  <div class="modal fade" id="createCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2 text-primary"></i>Nueva categoría</h5>
            <p class="text-secondary small mb-0 mt-1">Agrega un nuevo tipo de vehículo</p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div id="createAlert" class="alert alert-danger d-none" role="alert"></div>
          <form id="createCategoryForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Nombre de la categoría</label>
              <input type="text" class="form-control" id="createName" placeholder="SUV, Sedán, Pickup...">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción <span class="text-muted">(opcional)</span></label>
              <textarea class="form-control" id="createDescription" rows="3" placeholder="Descripción breve de la categoría..."></textarea>
            </div>
            <div class="d-grid">
              <button type="submit" id="createCategoryBtn" class="btn btn-primary btn-lg">
                <i class="bi bi-check-circle me-2"></i>Crear categoría
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL EDITAR -->
  <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>Editar categoría</h5>
            <p class="text-secondary small mb-0 mt-1">Modifica la información de la categoría</p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <div id="editAlert" class="alert alert-danger d-none" role="alert"></div>
          <input type="hidden" id="editCategoryId">
          <form id="editCategoryForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="editName">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción <span class="text-muted">(opcional)</span></label>
              <textarea class="form-control" id="editDescription" rows="3"></textarea>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="editActive">
              <label class="form-check-label" for="editActive">Categoría activa</label>
            </div>
            <div class="d-grid">
              <button type="submit" id="saveCategoryBtn" class="btn btn-primary btn-lg">
                <i class="bi bi-check-circle me-2"></i>Guardar cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/vehicle-categories.js"></script>
</body>
</html>
